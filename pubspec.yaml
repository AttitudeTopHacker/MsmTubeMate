name: msm_tubemate
description: "Msm TubeMate - All-in-one Media Discovery, Video/Audio Downloader & WhatsApp Status Saver (ORG: msm.movin 2022)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase Auth & PostgreSQL Database
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Resilient HTTP & Chunked Downloader
  dio: ^5.7.0

  # YouTube Extraction Fallback Engine
  youtube_explode_dart: ^2.3.6

  # Android System Native Share Intent Listener
  receive_sharing_intent: ^1.8.1

  # File Paths & Permissions
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1

  # Secure Storage for Private Vault
  flutter_secure_storage: ^9.2.2

  # UI, Media & Networking Helpers
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  intl: ^0.20.3
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
